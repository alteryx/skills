name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected an exact semver tag such as v0.1.0."
            exit 1
          fi

      - name: Checkout public mirror
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/extract-release-notes.mjs "$version" > release-notes.md

      # One ZIP per skill, with SKILL.md at the archive root, for clients that
      # take a single uploaded skill (such as Microsoft Copilot Studio).
      - name: Package skills
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/skill-packages"
          mkdir -p "$package_dir"
          for skill_dir in alteryx/skills/*/; do
            skill="$(basename "$skill_dir")"
            if [[ ! -f "$skill_dir/SKILL.md" ]]; then
              echo "Expected $skill_dir to contain SKILL.md."
              exit 1
            fi
            (cd "$skill_dir" && zip -r -X -q "$package_dir/$skill.zip" .)
          done
          ls -l "$package_dir"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Attach skill packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/skill-packages/*.zip --clobber
